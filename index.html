<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRC - Sistema de Registros Contables</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #007aff;
            --background: #f2f2f7;
            --container-bg: #ffffff;
            --border-radius: 18px;
            --shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--background);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 45px 35px;
            display: none;
            animation: fadeIn 0.3s ease forwards;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: none; }
        }

        h1, h2 {
            margin: 0 0 35px;
            font-size: 42px;
            font-weight: 600;
            color: #111;
            text-align: center;
        }

        .form-group { margin-bottom: 30px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 22px;
        }

        input, select, button {
            width: 100%;
            padding: 20px 25px;
            font-size: 24px;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            background: #fff;
            transition: border-color 0.2s;
        }

        input:focus, select:focus { border-color: var(--primary); outline: none; }
        button {
            cursor: pointer;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover { background: #0069e6; }
        button:active { background: #0051c8; transform: scale(0.97); }

        .btn-secundario {
            background: #e5e5ea;
            color: #007aff;
            margin-top: 15px;
        }
        .btn-secundario:hover { background: #d1d1d6; }

        .btn-ir-login {
            background: #34c759;
            color: white;
            margin-bottom: 25px;
        }

        .back-button {
            font-size: 26px;
            cursor: pointer;
            color: var(--primary);
            line-height: 1;
            margin-top: 35px;
            display: block;
            text-align: left;
            user-select: none;
            font-weight: 600;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f8fa;
            max-height: 350px;
            min-height: 250px;
            border: 1px solid #d1d1d6;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .mensaje {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 18px;
            line-height: 1.5;
            max-width: 85%;
        }

        .mensaje.usuario {
            background: #007aff;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .mensaje.sistema {
            background: #e5e5ea;
            color: #111;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input-wrapper input {
            flex: 1;
        }

        .chat-input-wrapper button {
            width: 140px;
            font-size: 20px;
        }

        .api-config-box {
            background: #f2f2f7;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #d1d1d6;
        }

        .api-config-box label {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .api-config-box input {
            padding: 10px 15px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .api-config-box button {
            padding: 10px 15px;
            font-size: 16px;
        }

        @media (max-width: 850px) {
            .container { max-width: 95%; padding: 30px 20px; }
            h2 { font-size: 30px; }
            input, select, button { padding: 12px 15px; font-size: 16px; }
            .chat-input-wrapper button { width: 100px; font-size: 16px; }
        }
    </style>
</head>
<body>

    <div id="panelChat" class="container" style="display:block;">
        <h2>Asistente IA SRC</h2>
        
        <button class="btn-ir-login" onclick="irAPantalla('pantalla1')">🔐 Acceder al Sistema SRC (Login)</button>

        <div class="api-config-box">
            <label for="apiKeyInput">🔑 Configurar OpenAI / Groq API Key:</label>
            <input type="password" id="apiKeyInput" placeholder="Pega tu nueva clave aquí (sk-... o gsk_...)" />
            <button type="button" onclick="guardarApiKey()">Guardar Clave</button>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="mensaje sistema"><b>SRC:</b> ¡Hola! Ingresa tu nueva API Key en el cuadro superior, haz clic en <b>Guardar Clave</b> y realiza tu consulta contable.</div>
        </div>
        
        <div class="chat-input-wrapper">
            <input type="text" id="mensaje" placeholder="Escribe tu consulta aquí..." onkeydown="evaluarTecla(event)">
            <button type="button" onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <div id="pantalla1" class="container">
        <h2>SRC · Inicio de Sesión</h2>
        <form id="form-login">
            <div class="form-group"><label for="usuario">Usuario</label><input type="text" id="usuario" required></div>
            <div class="form-group"><label for="contraseña">Contraseña</label><input type="password" id="contraseña" required></div>
            <button type="submit">Ingresar</button>
        </form>
        <div class="back-button" onclick="irAPantalla('panelChat')">← Volver al Asistente IA</div>
    </div>

    <div id="pantalla2" class="container">
        <h2>SR Contable</h2>
        <button class="btn-secundario" style="background:#ff3b30; color:white;" onclick="irAPantalla('panelChat')">🔴 Cerrar Sesión y salir al Chat</button>
    </div>

    <script>
        const usuarioCorrecto = 'admin';
        const contrasenaCorrecta = '12345';

        // Cargar clave guardada al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            const claveGuardada = localStorage.getItem('user_api_key');
            if (claveGuardada) {
                document.getElementById('apiKeyInput').value = claveGuardada;
            }
        });

        function guardarApiKey() {
            const clave = document.getElementById('apiKeyInput').value.trim();
            if (clave.length > 5) {
                localStorage.setItem('user_api_key', clave);
                alert('¡API Key guardada con éxito en tu navegador!');
            } else {
                alert('Por favor, ingresa una API Key válida.');
            }
        }

        const pantallas = ['pantalla1', 'pantalla2', 'panelChat'];

        function irAPantalla(idPantallaDestino) {
            pantallas.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = (id === idPantallaDestino) ? 'block' : 'none';
            });
        }

        document.getElementById('form-login').addEventListener('submit', e => {
            e.preventDefault();
            const u = document.getElementById('usuario').value.trim();
            const p = document.getElementById('contraseña').value.trim();
            if (u === usuarioCorrecto && p === contrasenaCorrecta) {
                irAPantalla('pantalla2');
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        });

        function evaluarTecla(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                enviarMensaje();
            }
        }

        async function enviarMensaje() {
            const inputMensaje = document.getElementById('mensaje');
            const textoMensaje = inputMensaje.value.trim();
            const chatBody = document.getElementById('chatBody');

            if (textoMensaje === "") return;

            const apiKey = localStorage.getItem('user_api_key') || document.getElementById('apiKeyInput').value.trim();

            if (!apiKey) {
                alert("Por favor, ingresa tu API Key en la casilla superior y presiona 'Guardar Clave' antes de enviar.");
                return;
            }

            // Detecta si la clave es de Groq (empieza con gsk_) o de OpenAI (sk-)
            const esGroq = apiKey.startsWith("gsk_");
            const endpoint = esGroq 
                ? "https://api.groq.com/openai/v1/chat/completions" 
                : "https://api.openai.com/v1/chat/completions";
            
            const modelo = esGroq ? "llama-3.3-70b-versatile" : "gpt-3.5-turbo";

            // Insertar mensaje del usuario en pantalla
            const divUsuario = document.createElement('div');
            divUsuario.className = 'mensaje usuario';
            divUsuario.innerHTML = `<b>Tú:</b> ${textoMensaje}`;
            chatBody.appendChild(divUsuario);
            
            inputMensaje.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            // Mensaje de carga
            const divPensando = document.createElement('div');
            divPensando.className = 'mensaje sistema';
            divPensando.innerHTML = `<b>SRC:</b> <i>Procesando tu consulta...</i>`;
            chatBody.appendChild(divPensando);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const respuesta = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelo,
                        messages: [
                            { role: "system", content: "Eres un asistente experto en contabilidad integrado en el sistema SRC." },
                            { role: "user", content: textoMensaje }
                        ]
                    })
                });

                const datos = await respuesta.json();

                if (respuesta.ok && datos.choices && datos.choices[0]) {
                    divPensando.innerHTML = `<b>SRC:</b> ${datos.choices[0].message.content.replace(/\n/g, '<br>')}`;
                } else {
                    const mensajeError = datos.error ? datos.error.message : 'Error al consultar la API.';
                    divPensando.innerHTML = `<b>SRC Error:</b> ${mensajeError}`;
                }
            } catch (error) {
                console.error("Error:", error);
                divPensando.innerHTML = `<b>SRC Error:</b> No se pudo establecer conexión (${error.message}).`;
            }
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>
</body>
</html>
